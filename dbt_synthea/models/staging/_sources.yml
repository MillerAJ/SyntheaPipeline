version: 2

sources:
  - name: raw_synthea_source
    schema: raw
    tables:
      - name: raw_synthea
        description: "One row per FHIR Bundle (one full patient record) loaded from Synthea."

models:
  - name: base_synthea_entries
    description: "Every individual FHIR resource unnested from raw_synthea bundles, one row per resource."
    columns:
      - name: raw_id
        tests: [not_null]
      - name: resource_type
        tests: [not_null]

  - name: stg_patients
    description: "Flattened Patient resources."
    columns:
      - name: patient_id
        tests: [not_null, unique]

  - name: stg_encounters
    description: "Flattened Encounter resources."
    columns:
      - name: encounter_id
        tests: [not_null, unique]
      - name: patient_id
        tests: [not_null]

  - name: stg_conditions
    description: "Flattened Condition resources."
    columns:
      - name: condition_id
        tests: [not_null, unique]

  - name: stg_observations
    description: "Flattened Observation resources."
    columns:
      - name: observation_id
        tests: [not_null, unique]
