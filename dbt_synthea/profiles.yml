synthea_pipeline:
  target: dev
  outputs:
    dev:
      type: postgres
      # Every value comes from the pipeline .env (no defaults): dbt stops with an error if one is missing.
      host: "{{ env_var('STAGING_DB_HOST') }}"
      user: "{{ env_var('STAGING_DB_USER') }}"
      password: "{{ env_var('STAGING_DB_PASSWORD') }}"
      port: "{{ env_var('STAGING_DB_PORT') | as_number }}"
      dbname: "{{ env_var('STAGING_DB_NAME') }}"
      schema: public
      threads: 4
